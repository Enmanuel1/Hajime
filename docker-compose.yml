services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: hajime
      POSTGRES_USER: ${DATABASE_USER:-hajime}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-hajime_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d hajime"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
